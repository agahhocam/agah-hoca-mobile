services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adpys
      POSTGRES_PASSWORD: adpys
      POSTGRES_DB: adpys
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adpys"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://adpys:adpys@db:5432/adpys
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://adpys:adpys@db:5432/adpys
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A app.infrastructure.celery.worker worker --loglevel=info

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
